# Publishes to npm with Trusted Publishing (OIDC, no token stored), same setup as coderbuzz/codex.
# Trigger: push a tag vX.Y.Z that equals package.json "version".
# npmjs.com > @coderbuzz/dsh > Settings > Trusted Publisher: GitHub Actions, coderbuzz / dsh / release.yml,
# "Allow npm publish" checked. The package must exist first: version 0.1.0 is published once by hand.
name: Release
on:
  push:
    tags: ["v*"]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token npm exchanges for a short-lived publish credential
    steps:
      - uses: actions/checkout@v7
      # Trusted Publishing needs Node 22.14+ and npm 11.5.1+.
      - uses: actions/setup-node@v7
        with:
          node-version: latest
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install -g npm@latest && npm --version
      - name: Tag matches package.json version
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME != package.json version $v"; exit 1; }
      - run: npm ci
      # No NODE_AUTH_TOKEN: with none set, npm uses OIDC. prepublishOnly runs the tests.
      - run: npm publish --access public
